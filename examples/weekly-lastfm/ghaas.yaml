# This fixture is intended for a separate target repository. Keep the command
# script at examples/weekly-lastfm/weekly-lastfm.sh after copying it.
version: 1

defaults:
  timeout: 15m

functions:
  weekly-lastfm:
    runtime: command
    command:
      - bash
      - examples/weekly-lastfm/weekly-lastfm.sh
    env:
      LASTFM_USERNAME: "replace-with-your-lastfm-username"
    secrets:
      - LASTFM_API_KEY
      - DISCORD_WEBHOOK_URL
    concurrency:
      max: 1
    schedule:
      # The provider may delay or drop a scheduled run.
      cron: "15 14 * * 5"
      timezone: America/New_York
