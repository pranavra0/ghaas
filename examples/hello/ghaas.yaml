# This fixture is intended to be copied into a separate target repository with
# examples/hello/hello.sh; generated workflows run in that target repository.
version: 1

defaults:
  timeout: 2m

functions:
  hello:
    runtime: command
    command:
      - bash
      - examples/hello/hello.sh
    env:
      GREETING: "hello from ghaas"
    schedule:
      # GitHub Actions evaluates this cron in UTC.
      cron: "0 9 * * *"
      timezone: UTC
